name: linux-gateway
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libmodbus-dev libmosquitto-dev libsqlite3-dev libsystemd-dev mosquitto mosquitto-clients
      - run: make -C linux CFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
      - run: python3 tests/e2e.py
