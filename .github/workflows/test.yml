name: host-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/core firmware/core/modbus_slave.c tests/test_modbus_slave.c -o /tmp/test_modbus_slave && /tmp/test_modbus_slave
